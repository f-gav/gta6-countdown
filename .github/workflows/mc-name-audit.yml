name: Minecraft nominative strict candidates analysis
on:
  push:
    branches: [name-audit-20261116]
    paths-ignore:
      - "out/**"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Russian morphology and frequency dictionaries
        run: python -m pip install --disable-pip-version-check wordfreq pymorphy3
      - name: Analyze nominative-only Russian nouns with strict glyphs
        run: python .github/scripts/mc-nominative.py
      - uses: actions/upload-artifact@v4
        with:
          name: nominative-candidates
          path: out/nominative_candidates.tsv
