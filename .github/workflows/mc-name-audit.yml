name: Minecraft username availability audit
on:
  push:
    branches: [name-audit-20261116]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query Mojang public API in 10-name batches
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, time, sys
          names = ["KaPToTeKa","KaPToHKa","KaPToH","KoMMyHa","KoMMyHaPb","KoMMeHTaPuu","PeCTaBPaTop","PeCToPaH","PeCToPaTop","PeKToP","PeKToPaT","CTaKaHuK","CTaHuHa","CTaTuCT","CTaTuKa","CTePHa","CaXapHuK","CaXapHocTb","BaHHuK","BaPeHKa","BoCKoBKa","BoCKoBHuK","BoCCTaHue","BoCKPeCeHue","BoPcuHKa","BoPcoBKa","BoPoHeHoK","MoXoBuK","MoPeMaH","MoPcuK","KyPeBo","KyPeHue","KyPeHb","KyCaKa","KyCaHue","KyCTapHuK","KyCTapCTBo","KyCTuCTocTb","KyXapKa","KyXapCTBo","PyCuCT","PyCuCTuKa","PyKaBuK","TeXHuKyM","TeXHoKpaT","TePpaca","TePPaPuyM","TePPopucT","TePPopucTKa","BaHTa","BoCK","CaMoKaT","CTeHKa","CTaKaH","CTaPuK","CTapocTb","CaHoBHuK","CaHuTaP","CaHuTaPKa","KoCaTKa","KaCaTKa","KoCaPb","KaCaHue","KaTaKoMBa","KaTaPaKTa","KaTapCuC","KaTaHa","KaTaHKa","KaTaHue","KaTaToHuK"]
          control = ["Notch", "jeb_"]
          base = "https://api.minecraftservices.com/minecraft/profile/lookup/bulk/byname"
          found, failed = set(), []
          allnames = control + names
          for idx in range(0,len(allnames),10):
              chunk = allnames[idx:idx+10]
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(base,json.dumps(chunk).encode(),{"User-Agent":"minecraft-audit/1.0","Content-Type":"application/json"},method="POST")
                      with urllib.request.urlopen(req,timeout=15) as resp:
                          items = json.load(resp)
                      if not isinstance(items,list): raise ValueError("non-list")
                      batch = {x["name"].lower() for x in items}
                      found |= batch
                      print(f"BATCH_OK|{idx//10}|"+",".join(sorted(batch)),flush=True)
                      break
                  except Exception as e:
                      print(f"BATCH_ERROR|{idx//10}|{str(e)[:120]}",flush=True)
                      if attempt<2: time.sleep(1)
              else: failed.extend(chunk)
          for n in names:
              status = "ERROR" if n in failed else "TAKEN" if n.lower() in found else "NO_PROFILE"
              print(f"RESULT|{n}|{status}",flush=True)
          print(f"SUMMARY|{len(names)}|{sum(x.lower() in found for x in names)}|{len(failed)}",flush=True)
          if not set(x.lower() for x in control) <= found: sys.exit(2)
          if failed: sys.exit(3)
          PY
