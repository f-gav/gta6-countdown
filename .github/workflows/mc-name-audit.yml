name: Minecraft media proper name source check
on:
  push:
    branches: [name-audit-20261116]
    paths:
      - '.github/scripts/mc-media-source.py'
      - '.github/workflows/mc-name-audit.yml'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read Russian fictional character names from public encyclopedias
        run: python .github/scripts/mc-media-source.py
