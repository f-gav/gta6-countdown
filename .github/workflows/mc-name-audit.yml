name: Minecraft 5000 strict-word nickname availability audit
on:
  push:
    branches: [name-audit-20261116]
    paths-ignore:
      - "out/**"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Russian frequency and morphological dictionaries
        run: python -m pip install --disable-pip-version-check wordfreq pymorphy3
      - name: Generate and verify 5000 candidates via Mojang public API
        run: python .github/scripts/mc-1000.py
      - name: Publish audited results to isolated branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add out/nicknames_5000.txt out/nicknames_5000.csv out/report_5000.json out/neutral_candidates.csv
          git commit -m "data: 5000 Mojang-audited strict visually Russian usernames [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-5000-verified
          path: |
            out/nicknames_5000.txt
            out/nicknames_5000.csv
            out/report_5000.json
            out/neutral_candidates.csv
