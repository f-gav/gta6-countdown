name: Minecraft cross-media character category research
on:
  push:
    branches: [name-audit-20261116]
    paths:
      - '.github/scripts/mc-media-research.py'
      - '.github/workflows/mc-name-audit.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Research Russian Wikipedia character categories across media
        run: python .github/scripts/mc-media-research.py
