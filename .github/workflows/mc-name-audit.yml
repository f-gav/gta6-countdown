name: Minecraft broad alphabet availability audit
on:
  push:
    branches: [name-audit-20261116]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Russian word frequency and morphological dictionaries
        run: python -m pip install --disable-pip-version-check wordfreq pymorphy3
      - name: Generate, query and balance Minecraft candidate names
        run: python .github/scripts/mc-1000.py
